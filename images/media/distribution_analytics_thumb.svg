<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGradDistThumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="pyramidGoldThumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="pyramidCyanThumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="lineGradThumb" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glowThumb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect width="120" height="120" rx="20" fill="url(#bgGradDistThumb)" />
  <rect x="1" y="1" width="118" height="118" rx="19" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" />

  <!-- Subtle Background Grid Lines -->
  <line x1="15" y1="36" x2="105" y2="36" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <line x1="15" y1="62" x2="105" y2="62" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <line x1="15" y1="88" x2="105" y2="88" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Mini Influence Pyramid Stack -->
  <!-- Tier 1 Apex -->
  <polygon points="60,18 48,32 72,32" fill="url(#pyramidGoldThumb)" filter="url(#glowThumb)" />
  <!-- Tier 2 -->
  <polygon points="45,35 75,35 79,48 41,48" fill="#38bdf8" opacity="0.95" />
  <!-- Tier 3 -->
  <polygon points="38,51 82,51 86,64 34,64" fill="#0284c7" opacity="0.9" />
  <!-- Tier 4 -->
  <polygon points="31,67 89,67 93,80 27,80" fill="#0369a1" opacity="0.85" />
  <!-- Tier 5 Base -->
  <polygon points="24,83 96,83 100,94 20,94" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />

  <!-- Upward Trend Line Overlay -->
  <path d="M 18,90 Q 45,78 65,52 T 102,24" fill="none" stroke="url(#lineGradThumb)" stroke-width="3" stroke-linecap="round" filter="url(#glowThumb)" />
  <circle cx="102" cy="24" r="3.5" fill="#34d399" stroke="#ffffff" stroke-width="1" />

  <!-- Bottom Badge: 3.75B+ -->
  <rect x="22" y="97" width="76" height="18" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" />
  <text x="60" y="110" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">3.75B+ REACH</text>
</svg>
