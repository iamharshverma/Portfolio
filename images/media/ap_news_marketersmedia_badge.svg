<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradAP" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14070a" />
      <stop offset="50%" stop-color="#240c12" />
      <stop offset="100%" stop-color="#0d0407" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="100%" stop-color="#e10600" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="16" fill="url(#bgGradAP)" />
  <rect x="1.5" y="1.5" width="597" height="337" rx="14.5" stroke="rgba(239,68,68,0.35)" stroke-width="3"/>
  <circle cx="510" cy="90" r="130" fill="#ef4444" opacity="0.14" />
  <circle cx="80" cy="270" r="100" fill="#dc2626" opacity="0.10" />

  <!-- Top Category Pill -->
  <rect x="170" y="34" width="260" height="28" rx="14" fill="rgba(239,68,68,0.22)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="300" y="52" fill="#fecaca" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">GLOBAL WIRE • AP NEWS PRESS</text>

  <!-- AP Badge / Logo Accent -->
  <g transform="translate(68, 88)">
    <rect width="52" height="52" rx="10" fill="#e10600" />
    <text x="26" y="38" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="1">AP</text>
  </g>

  <!-- Title / Outlet Header -->
  <text x="136" y="112" fill="#ffffff" font-family="'Georgia', -apple-system, serif" font-size="30" font-weight="900">AP News</text>
  <text x="265" y="112" fill="#f87171" font-family="'Segoe UI', -apple-system, sans-serif" font-size="19" font-weight="700">/ MarketersMEDIA</text>
  <text x="136" y="136" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13.5" font-weight="600">The Associated Press Global Press Release Network</text>

  <rect x="40" y="162" width="520" height="1.5" fill="rgba(255,255,255,0.15)" />

  <!-- Story Title -->
  <text text-anchor="middle" x="300" y="200" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="800">Harsh Verma on AI Agents: ‘The Clean Attack’ Challenge</text>
  <text text-anchor="middle" x="300" y="228" fill="url(#redGrad)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="700">Signals a Shift in Cybersecurity Strategy</text>

  <text text-anchor="middle" x="300" y="264" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13">Enterprise AI Innovation • Human-AI Collaboration • Palo Alto Networks</text>

  <!-- Bottom CTA Pill -->
  <rect x="200" y="292" width="200" height="28" rx="6" fill="rgba(239,68,68,0.2)" stroke="#f87171" stroke-width="1"/>
  <text x="300" y="311" fill="#fee2e2" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">READ ON AP NEWS</text>
</svg>
