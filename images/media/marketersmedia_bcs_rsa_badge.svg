<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradMM" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="340" rx="16" fill="url(#bgGradMM)" />
  <rect x="1.5" y="1.5" width="597" height="337" rx="14.5" stroke="rgba(56,189,248,0.35)" stroke-width="3"/>
  <circle cx="510" cy="85" r="130" fill="#38bdf8" opacity="0.12" />
  <circle cx="90" cy="270" r="110" fill="#6366f1" opacity="0.14" />

  <!-- Top Category Pill -->
  <rect x="155" y="30" width="290" height="28" rx="14" fill="rgba(56,189,248,0.18)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="48" fill="#bae6fd" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.2">GLOBAL WIRE • MARKETERSMEDIA PRESS</text>

  <!-- MarketersMEDIA Emblem & Outlet Header -->
  <g transform="translate(60, 78)">
    <rect width="50" height="50" rx="10" fill="#2563eb" />
    <path d="M12 36 V16 L25 28 L38 16 V36" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="124" y="102" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.3">MarketersMEDIA</text>
  <text x="325" y="102" fill="#38bdf8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="700">Wire</text>
  <text x="124" y="124" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="600">Global Financial &amp; Technology Syndication Network</text>

  <!-- Divider -->
  <rect x="40" y="148" width="520" height="1.5" fill="rgba(255,255,255,0.14)" />

  <!-- Headline & Subject -->
  <text text-anchor="middle" x="300" y="184" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-size="17" font-weight="800">Harsh Verma Awarded BCS Fellowship (FBCS)</text>
  <text text-anchor="middle" x="300" y="210" fill="url(#cyanBlueGrad)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="700">&amp; Publishes RSA Conference AI Security Analysis</text>
  <text text-anchor="middle" x="300" y="234" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13.5" font-weight="600">"Why Identity Alone Can No Longer Secure AI Systems"</text>

  <!-- Domain Tags -->
  <text text-anchor="middle" x="300" y="268" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">British Computer Society • RSA Conference • Agentic Security • Palo Alto Networks</text>

  <!-- Bottom CTA Pill -->
  <rect x="180" y="292" width="240" height="28" rx="6" fill="rgba(56,189,248,0.18)" stroke="#38bdf8" stroke-width="1"/>
  <text x="300" y="311" fill="#e0f2fe" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">READ ON MARKETERSMEDIA WIRE</text>
</svg>
