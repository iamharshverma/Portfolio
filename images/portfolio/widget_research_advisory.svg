<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: block;">
  <defs>
    <linearGradient id="bgGrad_adv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#141d2e" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.35" />
    </linearGradient>
    <pattern id="gridPattern_adv" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="360" fill="url(#bgGrad_adv)" />
  <rect width="640" height="360" fill="url(#gridPattern_adv)" />

  <!-- Top Window Header Bar -->
  <rect x="0" y="0" width="640" height="38" fill="rgba(15, 23, 42, 0.9)" />
  <line x1="0" y1="38" x2="640" y2="38" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  
  <!-- Traffic Light Window Controls -->
  <circle cx="20" cy="19" r="5" fill="#ef4444" />
  <circle cx="36" cy="19" r="5" fill="#f59e0b" />
  <circle cx="52" cy="19" r="5" fill="#10b981" />

  <!-- Category & Status Badge -->
  <rect x="75" y="8" width="240" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1" />
  <text x="195" y="23" fill="#34d399" font-size="10" font-weight="800" letter-spacing="0.5" text-anchor="middle">RESEARCH &amp; TECHNICAL ADVISORY</text>

  <rect x="460" y="8" width="160" height="22" rx="11" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)" stroke-width="1" />
  <circle cx="475" cy="19" r="3.5" fill="#f59e0b" />
  <text x="548" y="23" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Forbes Council &amp; IEEE</text>

  <!-- Content Graphics -->
  <g transform="translate(40, 60)">
    <!-- Column 1: Forbes Technology Council -->
    <rect x="0" y="0" width="170" height="105" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <circle cx="32" cy="32" r="15" fill="rgba(16,185,129,0.2)" />
    <path d="M26 32h12M32 26v12" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <text x="58" y="34" fill="#f8fafc" font-size="15" font-weight="800">Forbes Council</text>
    <text x="20" y="70" fill="#94a3b8" font-size="11" font-weight="600">Official Tech Member</text>
    <text x="20" y="88" fill="#34d399" font-size="10">Executive Advisory</text>

    <!-- Column 2: IEEE Senior Member -->
    <rect x="195" y="0" width="170" height="105" rx="10" fill="#111827" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="227" cy="32" r="15" fill="rgba(59,130,246,0.2)" />
    <path d="M221 28l6 8 6-8" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="253" y="34" fill="#f8fafc" font-size="15" font-weight="800">IEEE Senior</text>
    <text x="215" y="70" fill="#94a3b8" font-size="11" font-weight="600">Top 10% Membership</text>
    <text x="215" y="88" fill="#60a5fa" font-size="10">Security Standards</text>

    <!-- Column 3: Stanford Scholar -->
    <rect x="390" y="0" width="170" height="105" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="422" cy="32" r="15" fill="rgba(245,158,11,0.2)" />
    <polygon points="422,23 434,29 422,35 410,29" fill="#fbbf24" />
    <text x="448" y="34" fill="#f8fafc" font-size="15" font-weight="800">Stanford GSB</text>
    <text x="410" y="70" fill="#94a3b8" font-size="11" font-weight="600">Executive Scholar</text>
    <text x="410" y="88" fill="#fbbf24" font-size="10">AI Strategy &amp; Ventures</text>
  </g>

  <!-- Research & Advisory Domains Strip -->
  <g transform="translate(40, 185)">
    <rect width="560" height="90" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="20" y="25" fill="#e2e8f0" font-size="11" font-weight="700">CORE ADVISORY &amp; RESEARCH SCOPE</text>
    
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="165" height="34" rx="6" fill="#1e293b" />
      <circle cx="16" cy="17" r="4" fill="#34d399" />
      <text x="28" y="21" fill="#f1f5f9" font-size="10.5" font-weight="600">Agentic SecOps Audits</text>

      <rect x="180" y="0" width="165" height="34" rx="6" fill="#1e293b" />
      <circle cx="196" cy="17" r="4" fill="#60a5fa" />
      <text x="208" y="21" fill="#f1f5f9" font-size="10.5" font-weight="600">Zero-Trust NHI Architectures</text>

      <rect x="360" y="0" width="165" height="34" rx="6" fill="#1e293b" />
      <circle cx="376" cy="17" r="4" fill="#fbbf24" />
      <text x="388" y="21" fill="#f1f5f9" font-size="10.5" font-weight="600">Peer-Reviewed Collaborations</text>
    </g>
  </g>

  <!-- Bottom Interactive Footer -->
  <rect x="40" y="295" width="560" height="38" rx="8" fill="#111827" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <circle cx="58" cy="314" r="4" fill="#10b981" />
  <text x="72" y="318" fill="#cbd5e1" font-size="11" font-family="monospace">Inquiries: harshverma59@gmail.com • Palo Alto Networks Principal AI Eng.</text>
