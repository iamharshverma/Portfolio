<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: block;">
  <defs>
    <linearGradient id="bgGrad_skiplist_index_thumb_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3" />
    </linearGradient>
    <pattern id="gridPattern_skiplist_index_thumb_svg" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="360" fill="url(#bgGrad_skiplist_index_thumb_svg)" />
  <rect width="640" height="360" fill="url(#gridPattern_skiplist_index_thumb_svg)" />

  <!-- Top Window Header Bar -->
