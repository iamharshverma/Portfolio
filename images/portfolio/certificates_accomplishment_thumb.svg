<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: block;">
  <defs>
    <linearGradient id="bgGrad_certs_thumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="gridPattern_certs_thumb" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="360" fill="url(#bgGrad_certs_thumb)" />
  <rect width="640" height="360" fill="url(#gridPattern_certs_thumb)" />

  <!-- Top Window Header Bar -->
  <rect x="0" y="0" width="640" height="38" fill="rgba(15, 23, 42, 0.85)" />
  <line x1="0" y1="38" x2="640" y2="38" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  
  <!-- Traffic Light Window Controls -->
  <circle cx="20" cy="19" r="5" fill="#ef4444" />
  <circle cx="36" cy="19" r="5" fill="#f59e0b" />
  <circle cx="52" cy="19" r="5" fill="#10b981" />

  <!-- Category & Status Badge -->
  <rect x="75" y="8" width="230" height="22" rx="11" fill="rgba(255,255,255,0.08)" />
  <text x="190" y="23" fill="#38bdf8" font-size="10" font-weight="800" letter-spacing="0.5" text-anchor="middle">CERTIFICATIONS &amp; ACCOMPLISHMENTS</text>

  <rect x="430" y="8" width="190" height="22" rx="11" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)" stroke-width="1" />
  <circle cx="445" cy="19" r="3.5" fill="#fbbf24" />
  <text x="532" y="23" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Verified Accreditations • 30+ Certs</text>

  <!-- Left Certificate Card: DeepLearning & AI -->
  <g transform="translate(30, 60)">
    <rect width="165" height="185" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="1.8" filter="drop-shadow(0 6px 18px rgba(37,99,235,0.25))"/>
    
    <!-- Top badge ribbon -->
    <rect x="15" y="14" width="30" height="30" rx="8" fill="rgba(59,130,246,0.2)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="30" y="34" fill="#38bdf8" font-size="16" text-anchor="middle">🏆</text>
    
    <text x="54" y="27" fill="#ffffff" font-size="12" font-weight="700">Deep Learning</text>
    <text x="54" y="40" fill="#94a3b8" font-size="9.5">Specialization Track</text>

    <!-- Certificate credential pills -->
    <rect x="12" y="58" width="141" height="24" rx="5" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="22" cy="70" r="3" fill="#10b981"/>
    <text x="32" y="74" fill="#e2e8f0" font-size="9" font-weight="600">Neural Networks &amp; DL</text>

    <rect x="12" y="88" width="141" height="24" rx="5" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="22" cy="100" r="3" fill="#10b981"/>
    <text x="32" y="104" fill="#e2e8f0" font-size="9" font-weight="600">CNNs &amp; Computer Vision</text>

    <rect x="12" y="118" width="141" height="24" rx="5" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="22" cy="130" r="3" fill="#10b981"/>
    <text x="32" y="134" fill="#e2e8f0" font-size="9" font-weight="600">NLP &amp; Sequence Models</text>

    <rect x="12" y="148" width="141" height="24" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <text x="82" y="164" fill="#4ade80" font-size="9.5" font-weight="700" text-anchor="middle">✓ DeepLearning.AI Verified</text>
  </g>

  <!-- Connective Arrows 1 -->
  <path d="M 200 152 L 230 152" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="234,152 225,148 225,156" fill="#38bdf8"/>

  <!-- Center Hub: Stanford & Enterprise Architecture -->
  <g transform="translate(238, 55)">
    <rect width="185" height="195" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2" filter="drop-shadow(0 8px 24px rgba(245,158,11,0.25))"/>
    
    <!-- Stanford Emblem Ribbon -->
    <rect x="16" y="12" width="34" height="34" rx="8" fill="rgba(245,158,11,0.18)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="33" y="35" fill="#fbbf24" font-size="18" text-anchor="middle">🎓</text>

    <text x="58" y="26" fill="#fbbf24" font-size="13" font-weight="800">Stanford &amp; Machine Learning</text>
    <text x="58" y="40" fill="#94a3b8" font-size="9.5">Executive Accreditations</text>

    <!-- Inner credentials grid -->
    <g transform="translate(12, 54)">
      <rect width="161" height="36" rx="6" fill="#1e293b" stroke="rgba(245,158,11,0.3)"/>
      <text x="10" y="17" fill="#fbbf24" font-size="9.5" font-weight="700">Stanford ML Bootcamp</text>
      <text x="10" y="29" fill="#94a3b8" font-size="8.5">Supervised &amp; Unsupervised AI</text>
    </g>

    <g transform="translate(12, 96)">
      <rect width="161" height="36" rx="6" fill="#1e293b" stroke="rgba(56,189,248,0.3)"/>
      <text x="10" y="17" fill="#38bdf8" font-size="9.5" font-weight="700">Big Data &amp; Spark Ecosystem</text>
      <text x="10" y="29" fill="#94a3b8" font-size="8.5">PySpark, Hadoop, Distributed ML</text>
    </g>

    <g transform="translate(12, 138)">
      <rect width="161" height="42" rx="6" fill="#111827" stroke="rgba(168,85,247,0.4)"/>
      <text x="10" y="16" fill="#c084fc" font-size="9.5" font-weight="700">Full-Stack Enterprise &amp; J2EE</text>
      <text x="10" y="28" fill="#94a3b8" font-size="8.5">NIIT Certified Software Engineer</text>
      <text x="10" y="38" fill="#22c55e" font-size="7.5" font-weight="700">★ Honors Distinction Grade</text>
    </g>
  </g>

  <!-- Connective Arrows 2 -->
  <path d="M 428 152 L 458 152" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="462,152 453,148 453,156" fill="#a855f7"/>

  <!-- Right Vault Card: IEEE & Specialized Credentials -->
  <g transform="translate(465, 60)">
    <rect width="145" height="185" rx="12" fill="#111827" stroke="#a855f7" stroke-width="1.8" filter="drop-shadow(0 6px 18px rgba(168,85,247,0.25))"/>
    
    <!-- Top badge ribbon -->
    <rect x="14" y="14" width="30" height="30" rx="8" fill="rgba(168,85,247,0.2)" stroke="#c084fc" stroke-width="1.2"/>
    <text x="29" y="34" fill="#c084fc" font-size="16" text-anchor="middle">🛡️</text>
    
    <text x="50" y="27" fill="#ffffff" font-size="11.5" font-weight="700">Senior Grade</text>
    <text x="50" y="40" fill="#94a3b8" font-size="9.5">IEEE &amp; Fellow</text>

    <!-- Badges list -->
    <rect x="10" y="58" width="125" height="24" rx="5" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="20" cy="70" r="3" fill="#a855f7"/>
    <text x="28" y="74" fill="#e2e8f0" font-size="8.5" font-weight="600">IEEE Senior Member</text>

    <rect x="10" y="88" width="125" height="24" rx="5" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="20" cy="100" r="3" fill="#a855f7"/>
    <text x="28" y="104" fill="#e2e8f0" font-size="8.5" font-weight="600">Google GDE Cloud AI</text>

    <rect x="10" y="118" width="125" height="24" rx="5" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="20" cy="130" r="3" fill="#a855f7"/>
    <text x="28" y="134" fill="#e2e8f0" font-size="8.5" font-weight="600">IFGICT Fellow</text>

    <rect x="10" y="148" width="125" height="24" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="72" y="164" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">100% Peer Validated</text>
  </g>

  <!-- Bottom Terminal / Repository Banner -->
  <g transform="translate(30, 265)">
    <rect width="580" height="52" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.12)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.3))"/>
    
    <circle cx="22" cy="26" r="4" fill="#10b981" />
    <text x="36" y="22" fill="#94a3b8" font-size="10.5">Repository:</text>
    <text x="105" y="22" fill="#ffffff" font-size="11" font-weight="700">iamharshverma/CertificatesAccomplishment</text>
    <text x="36" y="38" fill="#64748b" font-size="9.5">Issuers: Stanford Online • Coursera • DeepLearning.AI • NIIT • IEEE • Global Fellowships</text>

    <!-- View Badge -->
    <rect x="475" y="14" width="90" height="24" rx="6" fill="rgba(37,99,235,0.3)" stroke="#38bdf8" stroke-width="1"/>
    <text x="520" y="30" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">30+ Verified ➔</text>
  </g>
</svg>
