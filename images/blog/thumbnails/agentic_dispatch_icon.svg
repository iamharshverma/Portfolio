<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="shieldFillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="iconDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="100" height="100" rx="22" fill="url(#iconBgGrad)" filter="url(#iconDropShadow)" />
  <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Geometric Grid & Glowing Nodes -->
  <circle cx="24" cy="24" r="2" fill="rgba(255,255,255,0.5)" />
  <circle cx="76" cy="24" r="2" fill="rgba(255,255,255,0.5)" />
  <circle cx="24" cy="76" r="2" fill="rgba(255,255,255,0.5)" />
  <circle cx="76" cy="76" r="2" fill="rgba(255,255,255,0.5)" />
  <path d="M 24 24 L 50 18 L 76 24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Center Shield Crest -->
  <path d="M50 22 L72 32 V54 C72 68 50 78 50 78 C50 78 28 68 28 54 V32 Z" 
        fill="url(#shieldFillGrad)" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Modern Dispatch Paper Airplane / Envelope Glyphs -->
  <path d="M38 45 L50 56 L62 45" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="36" y="42" width="28" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />
  
  <!-- Active Pulse Core -->
  <circle cx="50" cy="66" r="3.5" fill="#38bdf8" />
  <circle cx="50" cy="66" r="6" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.75" />
</svg>
