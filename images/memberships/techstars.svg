<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="techstarsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101c"/>
      <stop offset="50%" stop-color="#091829"/>
      <stop offset="100%" stop-color="#0d2838"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(34, 197, 94, 0.25)"/>
      <stop offset="100%" stop-color="rgba(34, 197, 94, 0)"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="100%" height="100%" fill="url(#techstarsBg)"/>
  
  <!-- Subtle Circuit Grid Pattern -->
  <g opacity="0.12" stroke="#22c55e" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="100" y1="0" x2="100" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="160"/>
    <line x1="300" y1="0" x2="300" y2="160"/>
  </g>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="72" cy="80" r="50" fill="url(#emeraldGlow)"/>

  <!-- Techstars Starburst Emblem Frame -->
  <g transform="translate(30, 28)">
    <rect width="84" height="104" rx="14" fill="#061220" stroke="rgba(34, 197, 94, 0.55)" stroke-width="1.75"/>
    <path d="M42 20 L49 38 L70 40 L53 54 L58 74 L42 63 L26 74 L31 54 L14 40 L35 38 Z" fill="url(#starGrad)"/>
    <circle cx="42" cy="48" r="9" fill="#061220"/>
    <path d="M38 48 L46 48 M42 44 L42 52" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="132" y="52" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">TECHSTARS NETWORK</text>
  
  <!-- Status Badge Pill -->
  <rect x="132" y="68" width="224" height="26" rx="13" fill="rgba(34, 197, 94, 0.18)" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="146" cy="81" r="3.5" fill="#22c55e"/>
  <text x="248" y="85" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="800" fill="#86efac" text-anchor="middle" letter-spacing="0.8">VENTURE MENTOR &amp; JUDGE</text>
  
  <!-- Institutional Subtitle -->
  <text x="132" y="116" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#93c5fd" letter-spacing="0.2">Global Accelerator &amp; Early-Stage Syndicate</text>
  <text x="132" y="134" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">Pitch Competitions, Sparring &amp; Technical Diligence</text>
</svg>
