      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0c172a"/>
      <stop offset="100%" stop-color="#0f2338"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background Frame -->
  <rect width="100%" height="100%" rx="16" fill="url(#techstarsBg)" stroke="rgba(34, 197, 94, 0.35)" stroke-width="1.5"/>
  
  <!-- Techstars Starburst Emblem -->
  <g transform="translate(36, 32)">
    <rect width="84" height="96" rx="14" fill="#081424" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1.5"/>
    <path d="M42 16 L49 36 L70 38 L53 52 L58 73 L42 61 L26 73 L31 52 L14 38 L35 36 Z" fill="url(#starGrad)"/>
