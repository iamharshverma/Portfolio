  </g>

  <!-- Typography -->
  <text x="136" y="58" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="21" font-weight="900" fill="#ffffff" letter-spacing="0.5">TECHSTARS NETWORK</text>
  
  <!-- Status Pill -->
  <rect x="136" y="74" width="205" height="26" rx="13" fill="rgba(34, 197, 94, 0.16)" stroke="#10b981" stroke-width="1.5"/>
