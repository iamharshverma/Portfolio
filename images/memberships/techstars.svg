  <!-- Institutional Subtitle -->
  <text x="136" y="120" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" letter-spacing="0.3">Worldwide Startup Accelerator · Global Syndicates</text>
