<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="stxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="50%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#081b33"/>
    </linearGradient>
    <linearGradient id="stxCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="stxGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" rx="16" fill="url(#stxBg)"/>
  <rect x="2" y="2" width="396" height="156" rx="14" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>
  
  <!-- Emblem Hexagon + Atomic Orbitals -->
  <g transform="translate(42, 35)">
    <polygon points="42,5 78,25 78,65 42,85 6,65 6,25" fill="#0f294a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="42" cy="45" r="16" fill="#0284c7" fill-opacity="0.5" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle cx="42" cy="45" r="6" fill="#ffffff"/>
    <!-- Electron orbits -->
    <ellipse cx="42" cy="45" rx="28" ry="11" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,2" transform="rotate(-30 42 45)"/>
    <ellipse cx="42" cy="45" rx="28" ry="11" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3,2" transform="rotate(30 42 45)"/>
    <circle cx="20" cy="30" r="3" fill="#38bdf8"/>
    <circle cx="64" cy="60" r="3" fill="#fbbf24"/>
  </g>
  
  <!-- Title & Organization -->
  <text x="142" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" fill="#ffffff" letter-spacing="0.5">SCIENCE TECH XPLORE</text>
  <text x="142" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#7dd3fc">Innovating Digital Humanity &amp; Computing</text>
  
  <!-- Tier Badge -->
  <rect x="142" y="86" width="150" height="26" rx="13" fill="url(#stxGold)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="217" y="103.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">FELLOW MEMBER</text>
  
  <text x="142" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">Distinguished Research &amp; Scientific Citation</text>
</svg>
