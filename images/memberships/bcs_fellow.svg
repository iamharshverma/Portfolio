<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="bcsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041829"/>
      <stop offset="50%" stop-color="#0a2a44"/>
      <stop offset="100%" stop-color="#0c3852"/>
    </linearGradient>
    <linearGradient id="bcsEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a887"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bcsGoldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Card Frame -->
  <rect width="100%" height="100%" rx="16" fill="url(#bcsBgGrad)" stroke="rgba(0, 168, 135, 0.35)" stroke-width="1.5"/>
  
  <!-- BCS Emblem Icon -->
  <g transform="translate(38, 36)">
    <!-- Shield / Seal -->
    <rect x="0" y="0" width="76" height="88" rx="14" fill="#061e33" stroke="url(#bcsEmblemGrad)" stroke-width="2.5"/>
    <path d="M12 20 L38 6 L64 20 L64 56 C64 72 38 82 38 82 C38 82 12 72 12 56 Z" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    
    <!-- Stylized BCS Monogram -->
    <text x="38" y="47" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">BCS</text>
    
    <!-- Star of Excellence -->
    <circle cx="38" cy="65" r="4.5" fill="url(#bcsGoldAccent)"/>
    <circle cx="26" cy="65" r="2.5" fill="rgba(255, 255, 255, 0.4)"/>
    <circle cx="50" cy="65" r="2.5" fill="rgba(255, 255, 255, 0.4)"/>
  </g>
  
  <!-- Main Typography -->
  <text x="132" y="58" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">BCS FELLOWSHIP</text>
  
  <!-- Fellowship Status Pill -->
  <rect x="132" y="74" width="168" height="26" rx="13" fill="rgba(0, 168, 135, 0.18)" stroke="#00a887" stroke-width="1.5"/>
  <text x="216" y="91" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#6ee7b7" text-anchor="middle" letter-spacing="1.2">FELLOW (FBCS)</text>
  
  <!-- Institutional Subtitle -->
  <text x="132" y="120" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="500" fill="#93c5fd" letter-spacing="0.2">The Chartered Institute for IT · United Kingdom</text>
</svg>
