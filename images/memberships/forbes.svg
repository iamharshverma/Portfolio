<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="forbesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081021"/>
      <stop offset="50%" stop-color="#0d1b36"/>
      <stop offset="100%" stop-color="#12254a"/>
    </linearGradient>
    <linearGradient id="forbesBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background Frame -->
  <rect width="100%" height="100%" rx="16" fill="url(#forbesBg)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5"/>
  
  <!-- Forbes Emblem Monogram -->
  <g transform="translate(36, 32)">
    <rect width="84" height="96" rx="14" fill="#060c18" stroke="rgba(59, 130, 246, 0.45)" stroke-width="1.5"/>
    <text x="42" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">F</text>
    <circle cx="42" cy="79" r="3" fill="#60a5fa"/>
  </g>

  <!-- Typography -->
  <text x="136" y="56" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">FORBES TECH COUNCIL</text>
  
  <!-- Status Pill -->
  <rect x="136" y="72" width="220" height="26" rx="13" fill="rgba(37, 99, 235, 0.18)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="246" y="89" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="1">INVITATION-ONLY MEMBER</text>
  
  <!-- Institutional Subtitle -->
  <text x="136" y="118" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" letter-spacing="0.3">Official Contributing Author &amp; Executive Council</text>
</svg>