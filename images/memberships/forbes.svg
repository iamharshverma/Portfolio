<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="forbesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0a162e"/>
      <stop offset="100%" stop-color="#0f2248"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.25)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0)"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="100%" height="100%" fill="url(#forbesBg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="100" y1="0" x2="100" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="160"/>
    <line x1="300" y1="0" x2="300" y2="160"/>
  </g>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="72" cy="80" r="50" fill="url(#blueGlow)"/>

  <!-- Forbes Emblem Monogram Frame -->
  <g transform="translate(30, 28)">
    <rect width="84" height="104" rx="14" fill="#060e20" stroke="rgba(59, 130, 246, 0.55)" stroke-width="1.75"/>
    <text x="42" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">F</text>
    <circle cx="42" cy="86" r="3.5" fill="#60a5fa"/>
  </g>

  <!-- Typography -->
  <text x="132" y="52" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">FORBES TECH COUNCIL</text>
  
  <!-- Status Badge Pill -->
  <rect x="132" y="68" width="224" height="26" rx="13" fill="rgba(37, 99, 235, 0.2)" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="146" cy="81" r="3.5" fill="#60a5fa"/>
  <text x="248" y="85" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="0.8">INVITATION-ONLY MEMBER</text>
  
  <!-- Institutional Subtitle -->
  <text x="132" y="116" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#93c5fd" letter-spacing="0.2">Official Contributing Author &amp; Executive Council</text>
  <text x="132" y="134" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">Autonomous Multi-Agent Systems &amp; AI Security</text>
</svg>