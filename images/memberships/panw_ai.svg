<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="panwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="panwFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="100%" stop-color="#fa582d"/>
    </linearGradient>
    <linearGradient id="panwGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(250, 88, 45, 0.28)"/>
      <stop offset="100%" stop-color="rgba(250, 88, 45, 0)"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="100%" height="100%" fill="url(#panwBg)"/>
  
  <!-- Subtle Security Mesh Grid Pattern -->
  <g opacity="0.12" stroke="#fa582d" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="100" y1="0" x2="100" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="160"/>
    <line x1="300" y1="0" x2="300" y2="160"/>
  </g>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="72" cy="80" r="50" fill="url(#panwGlow)"/>

  <!-- Palo Alto Networks Security Matrix Frame -->
  <g transform="translate(30, 28)">
    <rect width="84" height="104" rx="14" fill="#060c18" stroke="rgba(250, 88, 45, 0.55)" stroke-width="1.75"/>
    <path d="M42 18 L68 30 L68 58 C68 76 42 88 42 88 C42 88 16 76 16 58 L16 30 Z" fill="none" stroke="url(#panwFlame)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="42" cy="50" r="10" fill="#2dd4bf"/>
    <path d="M42 60 L42 72" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="42" cy="50" r="4.5" fill="#060c18"/>
  </g>

  <!-- Typography -->
  <text x="132" y="52" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">PALO ALTO NETWORKS</text>
  
  <!-- Status Badge Pill -->
  <rect x="132" y="68" width="224" height="26" rx="13" fill="rgba(250, 88, 45, 0.18)" stroke="#fa582d" stroke-width="1.5"/>
  <circle cx="146" cy="81" r="3.5" fill="#fa582d"/>
  <text x="248" y="85" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#ffedd5" text-anchor="middle" letter-spacing="0.8">PRINCIPAL AI ENGINEER</text>
  
  <!-- Institutional Subtitle -->
  <text x="132" y="116" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#93c5fd" letter-spacing="0.2">Enterprise AI Security &amp; Zero-Trust Architecture</text>
  <text x="132" y="134" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">Mission-Critical Scale &amp; Autonomous Agents</text>
</svg>
