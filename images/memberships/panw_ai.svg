<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="panwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#161f38"/>
    </linearGradient>
    <linearGradient id="panwFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="100%" stop-color="#fa582d"/>
    </linearGradient>
    <linearGradient id="panwTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Background Frame -->
  <rect width="100%" height="100%" rx="16" fill="url(#panwBg)" stroke="rgba(250, 88, 45, 0.4)" stroke-width="1.5"/>
  
  <!-- Security Shield & Circuit Nexus Emblem -->
  <g transform="translate(36, 32)">
    <rect width="84" height="96" rx="14" fill="#060c18" stroke="rgba(250, 88, 45, 0.45)" stroke-width="1.5"/>
    <!-- Outer Shield Geometry -->
    <path d="M42 16 L68 28 L68 56 C68 72 42 82 42 82 C42 82 16 72 16 56 L16 28 Z" fill="none" stroke="url(#panwFlame)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner Zero-Trust Keyhole / Lock -->
    <circle cx="42" cy="46" r="9" fill="url(#panwTeal)"/>
    <path d="M42 55 L42 66" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="42" cy="46" r="4" fill="#060c18"/>
  </g>

  <!-- Typography -->
  <text x="136" y="56" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">PALO ALTO NETWORKS</text>
  
  <!-- Status Pill -->
  <rect x="136" y="72" width="225" height="26" rx="13" fill="rgba(250, 88, 45, 0.16)" stroke="#fa582d" stroke-width="1.5"/>
  <text x="248" y="89" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#ff9975" text-anchor="middle" letter-spacing="1">PRINCIPAL AI ENGINEER</text>
  
  <!-- Institutional Subtitle -->
  <text x="136" y="118" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" letter-spacing="0.3">Enterprise AI Security &amp; Autonomous Agents</text>
</svg>
