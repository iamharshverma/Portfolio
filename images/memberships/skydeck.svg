<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="skydeckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001428"/>
      <stop offset="50%" stop-color="#002244"/>
      <stop offset="100%" stop-color="#003262"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdb515"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(253, 181, 21, 0.25)"/>
      <stop offset="100%" stop-color="rgba(253, 181, 21, 0)"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="100%" height="100%" fill="url(#skydeckBg)"/>
  
  <!-- Subtle Architectural Grid Pattern -->
  <g opacity="0.12" stroke="#fdb515" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="100" y1="0" x2="100" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="160"/>
    <line x1="300" y1="0" x2="300" y2="160"/>
  </g>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="72" cy="80" r="50" fill="url(#goldGlow)"/>

  <!-- Cal Berkeley SkyDeck Apex Shield Emblem -->
  <g transform="translate(30, 28)">
    <rect width="84" height="104" rx="14" fill="#001830" stroke="rgba(253, 181, 21, 0.55)" stroke-width="1.75"/>
    <!-- Triangular SkyDeck Apex -->
    <polygon points="42,20 68,82 16,82" fill="url(#goldGrad)"/>
    <polygon points="42,38 58,82 26,82" fill="#002244"/>
    <circle cx="42" cy="74" r="3.5" fill="#fdb515"/>
  </g>

  <!-- Typography -->
  <text x="132" y="52" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">BERKELEY SKYDECK</text>
  
  <!-- Status Badge Pill -->
  <rect x="132" y="68" width="224" height="26" rx="13" fill="rgba(253, 181, 21, 0.18)" stroke="#fdb515" stroke-width="1.5"/>
  <circle cx="146" cy="81" r="3.5" fill="#fdb515"/>
  <text x="248" y="85" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="0.8">GLOBAL ADVISOR &amp; MENTOR</text>
  
  <!-- Institutional Subtitle -->
  <text x="132" y="116" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#93c5fd" letter-spacing="0.2">UC Berkeley Premier Startup Accelerator</text>
  <text x="132" y="134" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">Batch Due Diligence &amp; Deep-Tech Architecture</text>
</svg>