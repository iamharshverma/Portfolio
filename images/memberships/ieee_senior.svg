<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="ieeeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a38"/>
      <stop offset="50%" stop-color="#002855"/>
      <stop offset="100%" stop-color="#033d73"/>
    </linearGradient>
    <linearGradient id="ieeeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Frame -->
  <rect width="100%" height="100%" rx="16" fill="url(#ieeeBg)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
  
  <!-- IEEE Diamond Key Emblem -->
  <g transform="translate(36, 32)">
    <rect width="84" height="96" rx="14" fill="#00142c" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5"/>
    <polygon points="42,16 66,54 42,78 18,54" fill="none" stroke="url(#ieeeCyan)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="42" cy="54" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M32 54 L52 54 M42 44 L42 64" stroke="url(#ieeeCyan)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="136" y="56" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">IEEE SENIOR MEMBER</text>
  
  <!-- Status Pill -->
  <rect x="136" y="72" width="220" height="26" rx="13" fill="rgba(56, 189, 248, 0.16)" stroke="#0284c7" stroke-width="1.5"/>
  <text x="246" y="89" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">TOP 8% WORLDWIDE GRADE</text>
  
  <!-- Institutional Subtitle -->
  <text x="136" y="118" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#bae6fd" letter-spacing="0.3">IEEE Computer Society · Peer-Reviewed Distinction</text>
</svg>