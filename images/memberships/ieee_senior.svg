<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="ieeeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00142c"/>
      <stop offset="50%" stop-color="#002246"/>
      <stop offset="100%" stop-color="#003566"/>
    </linearGradient>
    <linearGradient id="ieeeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="100%" height="100%" fill="url(#ieeeBg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#00b5e2" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="100" y1="0" x2="100" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="160"/>
    <line x1="300" y1="0" x2="300" y2="160"/>
  </g>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="72" cy="80" r="50" fill="url(#cyanGlow)"/>

  <!-- IEEE Diamond Key Frame -->
  <g transform="translate(30, 28)">
    <rect width="84" height="104" rx="14" fill="#00142c" stroke="rgba(56, 189, 248, 0.55)" stroke-width="1.75"/>
    <polygon points="42,18 68,58 42,90 16,58" fill="none" stroke="url(#ieeeCyan)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="42" cy="58" r="11" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M30 58 L54 58 M42 46 L42 70" stroke="url(#ieeeCyan)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="132" y="52" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">IEEE SENIOR MEMBER</text>
  
  <!-- Status Badge Pill -->
  <rect x="132" y="68" width="224" height="26" rx="13" fill="rgba(56, 189, 248, 0.18)" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="146" cy="81" r="3.5" fill="#38bdf8"/>
  <text x="248" y="85" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#bae6fd" text-anchor="middle" letter-spacing="0.8">TOP 8% WORLDWIDE GRADE</text>
  
  <!-- Institutional Subtitle -->
  <text x="132" y="116" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#93c5fd" letter-spacing="0.2">IEEE Computer Society · Peer Distinction</text>
  <text x="132" y="134" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1">Distributed Systems, Safety Evals &amp; Standards</text>
</svg>