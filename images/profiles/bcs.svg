<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bcsProfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041829"/>
      <stop offset="100%" stop-color="#0a2a44"/>
    </linearGradient>
    <linearGradient id="bcsProfTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a887"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bcsProfBg)"/>
  <rect x="2" y="2" width="96" height="96" rx="16" stroke="rgba(0, 168, 135, 0.4)" stroke-width="1.5" fill="none"/>
  
  <!-- Crest Emblem -->
  <g transform="translate(25, 14)">
