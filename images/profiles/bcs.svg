    <text x="25" y="32" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">BCS</text>
    <circle cx="25" cy="42" r="3" fill="#fbbf24"/>
  </g>
  
  <!-- Badge Pill -->
  <rect x="14" y="73" width="72" height="17" rx="8.5" fill="#00a887" stroke="rgba(255, 255, 255, 0.3)" stroke-width="0.75"/>
  <text x="50" y="84.5" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle" letter-spacing="0.6">FELLOW (FBCS)</text>
