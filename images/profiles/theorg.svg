<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="theOrgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="theOrgAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="theOrgPanw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa582d"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" rx="18" fill="url(#theOrgBg)"/>
  <rect x="2" y="2" width="96" height="96" rx="16" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" fill="none"/>
  
  <!-- The Org Tree Nodes / Hierarchy Emblem -->
  <g transform="translate(18, 16)">
    <!-- Root node (Org) -->
    <rect x="22" y="0" width="20" height="14" rx="4" fill="url(#theOrgAccent)"/>
    <circle cx="32" cy="7" r="2.5" fill="#ffffff"/>
    
    <!-- Tree connectors -->
    <path d="M32 14 V26 M14 26 H50 M14 26 V34 M32 26 V34 M50 26 V34" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Child nodes -->
    <rect x="5" y="34" width="18" height="12" rx="3" fill="#334155" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <rect x="23" y="34" width="18" height="12" rx="3" fill="url(#theOrgPanw)"/>
    <rect x="41" y="34" width="18" height="12" rx="3" fill="#334155" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>
  
  <!-- "THE ORG" Text -->
  <text x="50" y="75" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">THE ORG</text>
  
  <!-- Verified Badge Pill -->
  <rect x="16" y="80" width="68" height="14" rx="7" fill="rgba(2, 132, 199, 0.25)" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="50" y="90" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="0.5">PANW VERIFIED</text>
</svg>
