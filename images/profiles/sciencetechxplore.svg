  </defs>
  <rect width="100" height="100" rx="18" fill="url(#stxProfBg)"/>
  <rect x="2" y="2" width="96" height="96" rx="16" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" fill="none"/>
  
