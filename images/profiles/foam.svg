<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="foamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="foamAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#foamBg)"/>
  <rect x="2" y="2" width="96" height="96" rx="16" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" fill="none"/>
  
  <!-- Foam Speaker / Media Kit Emblem -->
  <g transform="translate(20, 16)">
    <!-- Document / Folder Backing -->
    <rect x="6" y="4" width="48" height="42" rx="6" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>
    <!-- Overlapping Card -->
    <rect x="12" y="10" width="48" height="42" rx="6" fill="url(#foamAccent)" stroke="#c7d2fe" stroke-width="1.5"/>
    <!-- Microphone / Broadcast Symbol -->
    <circle cx="36" cy="25" r="5" fill="#ffffff"/>
    <path d="M36 30 V36 M30 36 H42" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 25 C28 29.5 44 29.5 44 25" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  
  <!-- Text Label -->
  <rect x="14" y="68" width="72" height="18" rx="9" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="50" y="80.5" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing="1">FOAM KIT</text>
</svg>
