<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="frontiersBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="frontiersAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="loopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" rx="18" fill="url(#frontiersBg)"/>
  <rect x="2" y="2" width="96" height="96" rx="16" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" fill="none"/>
  
  <!-- Loop / Frontiers Crest Symbol -->
  <g transform="translate(18, 12)">
    <!-- Infinity / Connected Research Network Loops -->
    <path d="M18 20 C10 12, 0 16, 0 24 C0 32, 10 36, 18 28 C26 20, 36 16, 44 24 C52 32, 42 40, 34 36" fill="none" stroke="url(#frontiersAccent)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M46 24 C46 16, 36 12, 28 20 C20 28, 10 32, 2 24" fill="none" stroke="url(#loopGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 1"/>
    
    <!-- Editorial Book / Graduation Cap Node -->
    <circle cx="32" cy="14" r="4" fill="#38bdf8"/>
    <circle cx="12" cy="34" r="3.5" fill="#f43f5e"/>
    <circle cx="48" cy="24" r="3" fill="#fbbf24"/>
  </g>
  
  <!-- "frontiers" wordmark -->
  <text x="50" y="66" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">frontiers</text>
  
  <!-- "IN EDUCATION" subtitle -->
  <text x="50" y="76" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="6.8" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.8">IN EDUCATION</text>
  
  <!-- Editorial Badge Pill -->
  <rect x="10" y="81" width="80" height="13" rx="6.5" fill="rgba(2, 132, 199, 0.25)" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="50" y="90" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="6.5" font-weight="800" fill="#e0f2fe" text-anchor="middle" letter-spacing="0.4">LOOP EDITORIAL BOARD</text>
</svg>
