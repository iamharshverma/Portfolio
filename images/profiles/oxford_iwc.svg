<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="oxfordBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001833"/>
      <stop offset="50%" stop-color="#002147"/>
      <stop offset="100%" stop-color="#0a3260"/>
    </linearGradient>
    <linearGradient id="oxfordGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" rx="18" fill="url(#oxfordBg)"/>
  <rect x="2" y="2" width="96" height="96" rx="16" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" fill="none"/>
  
  <!-- Oxford / Open Book Crest -->
  <g transform="translate(26, 12)">
    <!-- Shield -->
    <path d="M4 4 H44 V26 C44 40 24 50 24 50 C24 50 4 40 4 26 Z" fill="#001429" stroke="url(#oxfordGold)" stroke-width="1.8"/>
    <!-- Open Book Symbol -->
    <path d="M12 18 C16 16 22 17 24 19 C26 17 32 16 36 18 V34 C32 32 26 33 24 35 C22 33 16 32 12 34 Z" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M24 19 V35" stroke="#ffffff" stroke-width="1.6"/>
    <!-- Crown / Star -->
    <circle cx="24" cy="10" r="2.5" fill="#f59e0b"/>
  </g>
  
  <!-- "OUP • IwC" -->
  <text x="50" y="72" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">OUP · IwC</text>
  
  <!-- ScholarOne Badge Pill -->
  <rect x="10" y="78" width="80" height="15" rx="7.5" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="50" y="89" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="7" font-weight="800" fill="#fde68a" text-anchor="middle" letter-spacing="0.4">SCHOLARONE PEER REVIEW</text>
</svg>
