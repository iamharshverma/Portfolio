<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
      <linearGradient id="flipboardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f52828"/>
        <stop offset="100%" stop-color="#c91818"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" rx="18" fill="url(#flipboardGrad)"/>
    <rect x="2" y="2" width="96" height="96" rx="16" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none"/>
    
    <!-- Flipboard Iconic Geometric 'F' Mark -->
    <g transform="translate(30, 20)">
        <!-- Left vertical bar (3 blocks: 20x20 each) -->
        <rect x="0" y="0" width="20" height="20" fill="#ffffff"/>
        <rect x="0" y="20" width="20" height="20" fill="#ffffff"/>
        <rect x="0" y="40" width="20" height="20" fill="#ffffff"/>
        
        <!-- Top horizontal bar -->
        <rect x="20" y="0" width="20" height="20" fill="#ffffff"/>
        
        <!-- Iconic Semi-transparent center layer block -->
        <rect x="20" y="20" width="20" height="20" fill="#ffffff" fill-opacity="0.6"/>
    </g>
    
    <!-- Sub-label Pill -->
    <rect x="14" y="73" width="72" height="15" rx="7.5" fill="rgba(0, 0, 0, 0.22)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.75"/>
    <text x="50" y="83.5" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" text-anchor="middle" letter-spacing="0.8">FLIPBOARD</text>
</svg>
