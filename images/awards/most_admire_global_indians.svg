<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-magi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2744"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="gold-magi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="chakra-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#bg-magi)"/>
  <rect x="8" y="8" width="384" height="224" rx="12" fill="none" stroke="url(#gold-magi)" stroke-width="2"/>
  
  <!-- Emblem Laurel & Globe / Sun Motif -->
  <g transform="translate(200, 52)">
    <!-- Outer Star Ray Rays -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#gold-magi)" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="20" fill="rgba(245, 158, 11, 0.15)" stroke="url(#gold-magi)" stroke-width="1.5"/>
    <!-- Central Icon: Globe & Star -->
    <path d="M-8,-2 C-8,-8 8,-8 8,-2 C8,5 -8,5 -8,-2 Z" fill="none" stroke="url(#gold-magi)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="url(#gold-magi)" stroke-width="1.2"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="url(#gold-magi)" stroke-width="1.2"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="url(#gold-magi)" stroke-width="1.2"/>
    <!-- Laurels -->
    <path d="M-28,8 C-34,-8 -22,-20 -8,-24" fill="none" stroke="url(#gold-magi)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M28,8 C34,-8 22,-20 8,-24" fill="none" stroke="url(#gold-magi)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <text x="200" y="116" fill="url(#gold-magi)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="3.2">GLOBAL LEADERSHIP HONORS</text>
  <text x="200" y="146" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="0.8">MOST ADMIRE GLOBAL INDIANS 2026</text>
  <text x="200" y="172" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">GLOBAL IMPACT &amp; AI INNOVATION HONOREE</text>
  <text x="200" y="202" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" text-anchor="middle">Celebrating Pioneering Indian Leaders Shaping the Global Future</text>
</svg>
